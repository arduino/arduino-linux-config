version: "2"
linters:
  enable:
    - bodyclose
    - dogsled
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - importas
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - forbidigo
    - gochecknoinits
  settings:
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: in cli package use `feedback.*` instead
        - pattern: (os\.(Stdout|Stderr|Stdin))(# )?
          msg: in cli package use `feedback.*` instead
        - pattern: ^os\.(WriteFile|Create|OpenFile|Remove|RemoveAll|Mkdir|MkdirAll|Rename|Chmod|Chown|Symlink|Link|Truncate)$
          msg: every side effect must go through internal/executor, otherwise --dry-run lies
        - pattern: ^paths\.Path\.(WriteFile|Create|Append|Remove|RemoveAll|Mkdir|MkdirAll|Rename|Chmod|Chtimes|Truncate|CopyTo|CopyDirTo)$
          msg: every side effect must go through internal/executor, otherwise --dry-run lies
        - pattern: ^(exec\.Command(Context)?|paths\.NewProcess(FromPath)?)$
          msg: run external commands through executor.Executor.Run, otherwise --dry-run lies
        - pattern: ^paths\.Process\.(Run|RunWithinContext|RunAndCaptureOutput|RunAndCaptureCombinedOutput|Start|Wait|WaitWithinContext|Signal|Kill)$
          msg: run external commands through executor.Executor.Run, otherwise --dry-run lies
        - pattern: ^syscall\.
          msg: wrap the syscall in internal/executor, otherwise --dry-run lies
      analyze-types: true
    misspell:
      locale: US
    revive:
      rules:
        - name: indent-error-flow
          disabled: true
    goconst:
      ignore-string-values:
        - ".exe"
        - "windows"
        - "linux"
        - "darwin"

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: cmd/arduino-linux-config/*_test.go
        linters:
          - forbidigo
      - path: cmd/feedback/
        linters:
          - forbidigo
      - path: cmd/gendoc/
        linters:
          - forbidigo
      - path: pkg/board/remote/adb
        linters:
          - forbidigo
      - path: internal/e2e
        linters:
          - forbidigo
      # The executor is the only place allowed to touch the system.
      - path: internal/(executor|sync|testutil)/
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/arduino/arduino-linux-config
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
